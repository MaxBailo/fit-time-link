<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7EAE7">
<title>Fit-time</title>
<style>
  /* Нічого не показуємо: лише фон кольору заставки застосунку, щоб перехід був непомітним */
  html, body { margin: 0; height: 100%; background: #F7EAE7; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
         font-family: -apple-system, "Segoe UI", sans-serif; color: #B87E7C; text-align: center; }
  #err { display: none; }
  #err.show { display: block; }
  button { margin-top: 10px; background: #E8647F; color: #fff; border: none; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div id="err">
    <div style="font-size: 38px">😕</div>
    <div style="margin-top: 8px">Застосунок зараз недоступний.<br>Спробуй за хвилину.</div>
    <button onclick="location.reload()">Спробувати ще раз</button>
  </div>

<script>
// Постійна адреса застосунку. Нічого не показує: бере актуальну адресу тунелю з файлу target.json
// (його оновлює watchdog при кожному перезапуску) і одразу переходить туди, зберігаючи
// дані авторизації Telegram (location.hash).
const REPO = "MaxBailo/fit-time-link";

// Беремо адресу з трьох джерел одразу, перемагає найшвидше: GitHub Pages (без ліміту запитів),
// raw.githubusercontent.com і GitHub API (60 запитів/год з однієї IP - лише запасний варіант).
const SOURCES = [
  () => `${location.origin}${location.pathname.replace(/[^/]*$/, "")}target.json?t=${Date.now()}`,
  () => `https://raw.githubusercontent.com/${REPO}/main/target.json?t=${Date.now()}`,
  () => `https://api.github.com/repos/${REPO}/contents/target.json?t=${Date.now()}`,
];

function fetchUrl(make) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  return fetch(make(), { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store", signal: ctrl.signal })
    .then(async (res) => {
      if (!res.ok) throw new Error(res.status);
      const { url } = await res.json();
      if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(url)) throw new Error("bad url");
      return url;
    })
    .finally(() => clearTimeout(timer));
}

async function go(attempt = 0) {
  try {
    const url = await Promise.any(SOURCES.map(fetchUrl));
    location.replace(url.replace(/\/$/, "") + "/" + location.search + location.hash);
  } catch (e) {
    if (attempt < 1) return setTimeout(() => go(attempt + 1), 800);
    document.getElementById("err").classList.add("show");
  }
}go();
</script>
</body>
</html>
